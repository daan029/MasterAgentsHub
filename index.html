:root{
  --void:#05070d;
  --void-2:#0b0f1c;
  --hub:#f5b942;
  --hub-2:#ffe3a0;
  --hub-dark:#7a5420;
  --online:#4fd1ff;
  --busy:#6ee7a8;
  --offline:#7b84a6;
  --error:#ff5d5d;
  --text:#e8ecf5;
  --text-dim:#7c879e;
  --line:#1c2338;
  --zoom:1;
}

*{box-sizing:border-box;}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--void);
  color:var(--text);
  overflow:hidden;
  overscroll-behavior:none;
  font-family:'JetBrains Mono',ui-monospace,monospace;
}

#viewport{
  position:fixed;
  inset:0;
  overflow:hidden;
  cursor:grab;
  touch-action:none;
  background:radial-gradient(ellipse at 50% 35%, #0d1226 0%, #05070d 62%, #030409 100%);
}
#viewport.dragging{cursor:grabbing;}

.starlayer{
  position:absolute;
  top:50%;
  left:50%;
  width:2400px;
  height:2400px;
  margin:-1200px 0 0 -1200px;
  pointer-events:none;
  will-change:transform;
}

.nebula{
  position:absolute;
  border-radius:50%;
  filter:blur(60px);
  pointer-events:none;
  opacity:.4;
}

.twinkle{
  position:absolute;
  width:2px;height:2px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 6px 1px rgba(255,255,255,.8);
  animation:twinkle 3.4s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.15;transform:scale(1);}
  50%{opacity:1;transform:scale(1.6);}
}

#world{
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  will-change:transform;
}

.link-svg{
  position:absolute;
  top:-1300px;
  left:-1300px;
  width:2600px;
  height:2600px;
  overflow:visible;
  pointer-events:none;
}

.ring{
  position:absolute;
  top:50%;
  left:50%;
  border:1px solid rgba(245,185,66,.28);
  border-radius:50%;
  transform-origin:center;
  pointer-events:none;
}

.hub{
  position:absolute;
  top:50%;
  left:50%;
  width:104px;
  height:104px;
  margin:-52px 0 0 -52px;
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%, var(--hub-2) 0%, var(--hub) 42%, var(--hub-dark) 100%);
  box-shadow:
    0 0 40px 6px rgba(245,185,66,.5),
    inset -14px -14px 30px rgba(0,0,0,.4),
    inset 8px 8px 18px rgba(255,240,200,.35);
}
/* separate, cheap glow layer — only transform/opacity animate, never
   box-shadow, to avoid a repaint-heavy animation ghosting on mobile Safari */
.hub-glow{
  position:absolute;
  top:50%;
  left:50%;
  width:104px;
  height:104px;
  margin:-52px 0 0 -52px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(245,185,66,.55) 0%, rgba(245,185,66,0) 70%);
  animation:breathe 5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes breathe{
  0%,100%{transform:scale(1.35);opacity:.55;}
  50%{transform:scale(1.7);opacity:.85;}
}

.node{
  position:absolute;
  width:52px;
  height:52px;
  margin:-26px 0 0 -26px;
  border-radius:50%;
  cursor:pointer;
  pointer-events:auto;
}

.label{
  position:absolute;
  transform:translate(-50%,-100%);
  pointer-events:auto;
  padding-bottom:16px;
  text-align:center;
  white-space:nowrap;
  cursor:pointer;
}
/* Clustered agents (see buildClusterNodes) anchor their label below the
   whole cluster instead of above a single node — text grows downward
   from the anchor instead of upward into it. */
.label.below{transform:translate(-50%,0);padding-bottom:0;padding-top:16px;}
.label .name{
  font-family:'Rajdhani',sans-serif;
  font-weight:600;
  font-size:15px;
  letter-spacing:.03em;
  color:var(--text);
  text-shadow:0 1px 2px rgba(0,0,0,.85), 0 1px 1px rgba(0,0,0,.6);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.label .chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:3px;
  padding:2px 8px;
  border-radius:100px;
  border:1px solid var(--line);
  background:rgba(11,15,28,.72);
  backdrop-filter:blur(2px);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.label .chip .dot{width:6px;height:6px;border-radius:50%;box-shadow:0 0 6px 1px currentColor;}
.label .channel-line{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  margin-top:2px;
  font-family:'Rajdhani',sans-serif;
  font-size:11px;
  letter-spacing:.02em;
  color:var(--text-dim);
  text-shadow:0 1px 2px rgba(0,0,0,.85);
}
.label .channel-line svg{flex:0 0 auto;display:block;}
.label.hub-label{padding-bottom:70px;}
.label.hub-label .name{
  font-size:19px;
  letter-spacing:.06em;
  color:var(--hub);
}

.label.online .chip{color:var(--online);}
.label.busy .chip{color:var(--busy);}
.label.busy .chip .dot{animation:pulse 1.4s ease-in-out infinite;}
.label.offline .chip{color:var(--offline);opacity:.85;}
.label.error .chip{color:var(--error);}
.label .chip .dot{background:currentColor;color:currentColor;}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.4;transform:scale(1.3);}
}

/* ---- overlay UI (fixed, independent of pan/zoom) ---- */
.overlay{position:fixed;inset:0;pointer-events:none;z-index:10;}

.brand{position:absolute;top:28px;left:32px;pointer-events:none;padding-top:env(safe-area-inset-top);}
.brand .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.28em;color:var(--hub);text-transform:uppercase;opacity:.85;}
.brand h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:2px 0 0;text-wrap:balance;color:var(--text);}
.brand .sub{font-size:11px;color:var(--text-dim);margin-top:4px;letter-spacing:.03em;}

.legend{position:absolute;bottom:28px;left:32px;display:flex;flex-direction:column;gap:8px;font-size:11px;letter-spacing:.05em;color:var(--text-dim);padding-bottom:env(safe-area-inset-bottom);}
.legend .row{display:flex;align-items:center;gap:8px;}
.legend .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px 1px currentColor;}
.legend .dot.online{background:var(--online);color:var(--online);}
.legend .dot.busy{background:var(--busy);color:var(--busy);}
.legend .dot.offline{background:var(--offline);color:var(--offline);opacity:.75;}
.legend .dot.error{background:var(--error);color:var(--error);}

.hint{position:absolute;bottom:28px;right:32px;font-size:11px;color:var(--text-dim);letter-spacing:.05em;text-align:right;padding-bottom:env(safe-area-inset-bottom);}

.refresh-btn{
  position:absolute;bottom:28px;right:88px;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:rgba(11,15,28,.72);backdrop-filter:blur(6px);
  color:var(--text-dim);cursor:pointer;pointer-events:auto;
  padding:0;margin-bottom:env(safe-area-inset-bottom);
  transition:color .15s ease, border-color .15s ease, transform .15s ease;
}
.refresh-btn:hover{color:var(--hub);border-color:var(--hub-dark);}
.refresh-btn:active{transform:scale(.92);}
.refresh-btn svg{width:16px;height:16px;display:block;}
.refresh-btn.spinning svg{animation:spin .7s linear;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.readout{position:absolute;top:28px;right:32px;text-align:right;font-size:11px;color:var(--text-dim);letter-spacing:.05em;font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top);}
.readout .count{color:var(--hub);font-weight:700;font-size:13px;}

.panel{
  position:absolute;top:50%;right:32px;transform:translateY(-50%) translateX(16px);
  width:300px;max-width:calc(100vw - 64px);padding:20px 22px;
  max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);background:rgba(11,15,28,.82);backdrop-filter:blur(6px);border-radius:4px;
  pointer-events:auto;opacity:0;visibility:hidden;transition:opacity .2s ease, transform .2s ease, visibility .2s;
}
.panel.open{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0);}
.panel .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);}
.panel h2{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:24px;margin:4px 0 10px;color:var(--text);text-wrap:balance;}
.panel .status-row{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;}
.panel .status-row .dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 7px 1px currentColor;}
.panel p{font-size:12.5px;line-height:1.6;color:var(--text-dim);margin:0 0 12px;}
.panel .meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-dim);border-top:1px solid var(--line);padding-top:10px;letter-spacing:.04em;}
.panel .meta b{color:var(--text);font-weight:500;}
.panel .close{position:absolute;top:14px;right:14px;width:22px;height:22px;border:none;background:transparent;color:var(--text-dim);font-size:16px;line-height:1;cursor:pointer;font-family:inherit;}
.panel .close:hover{color:var(--text);}

.panel .stats-toggle{
  margin-top:2px;
  border-top:1px solid var(--line);
  padding-top:10px;
}
.panel .stats-toggle[open]{padding-bottom:2px;}
.panel .stats-toggle summary{
  cursor:pointer;
  list-style:none;
  font-size:10.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--hub);
  display:flex;
  align-items:center;
  gap:6px;
  user-select:none;
}
.panel .stats-toggle summary::-webkit-details-marker{display:none;}
.panel .stats-toggle summary::before{
  content:"▸";
  display:inline-block;
  font-size:9px;
  transition:transform .15s ease;
}
.panel .stats-toggle[open] summary::before{transform:rotate(90deg);}
.panel .stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 14px;
  margin-top:12px;
}
.panel .stat-tile{
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:3px;
  background:rgba(255,255,255,.02);
}
.panel .stat-tile .stat-label{
  font-size:9px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-dim);
}
.panel .stat-tile .stat-value{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:14px;
  color:var(--text);
  margin-top:2px;
  font-variant-numeric:tabular-nums;
}
.panel .stats-note{
  font-size:9.5px;
  line-height:1.5;
  color:var(--text-dim);
  margin-top:10px;
  opacity:.8;
}

@media (max-width: 640px){

<script>
(function(){

      lastActive: "21 Aug 2026 — Supergaande campaign: clip 1 live on all 3 platforms, clips 2 & 3 scheduled",
      youtube: { handle: "klipje", channelTitle: "Klipje" },
      // Renders as 3 small clustered nodes (one per platform) instead of
      // one big sphere — see buildClusterNodes(). Order here = visual order.
      platforms: [
        { key: "youtube", label: "YouTube" },
        { key: "tiktok", label: "TikTok" },
        { key: "instagram", label: "Instagram (@klipje0)" }
      ],
      stats: [
        { label: "Subscribers", value: "…" },
        { label: "Videos posted", value: "…" },
        { label: "Total views", value: "…" },
        { label: "Total likes", value: "…" },

        { label: "Instagram (@klipje0)", value: "Posting live — stats not wired up" }
      ],
      statsNote: "Loading live figures from YouTube…"
    }
  ];

  // ---------------------------------------------------------------------
  // Live YouTube stats — fetched fresh every page load, straight from the
  // browser to the public YouTube Data API. Deliberately NOT routed through
  // the production laptop/agent: this is what makes "videos posted" and
  // "total views" stay accurate even when that machine is asleep or offline
  // (see [[project_master_agents_hub]] memory — this was a deliberate
  // earlier deferral, wired up 2026-08-17).
  //
  // Read-only public data key, restricted (API restrictions -> YouTube Data
  // API v3 only) in Google Cloud Console under the same "trinkettales"
  // project as the uploader's OAuth client. This key can only read public
  // channel/video data — it cannot upload, delete, or modify anything, so
  // shipping it inside client-side HTML in a private repo is an acceptable
  // trade-off. Do not reuse it for anything beyond public reads.
  //
  // >>> PASTE_YOUR_YOUTUBE_API_KEY_HERE below, replacing the placeholder
  // string (keep the quotes). <<<
  // ---------------------------------------------------------------------
  var YOUTUBE_API_KEY = "AIzaSyARUbxjVoOjlaryPzVDa_or8MjMKEHKMS4";
  var YT_API_BASE = "https://www.googleapis.com/youtube/v3/";

  function ytFormatDate(iso) {
    var d = new Date(iso);
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return d.getUTCDate() + " " + months[d.getUTCMonth()] + " " + d.getUTCFullYear();
  }

  function ytFetchAllPlaylistItems(playlistId, pageToken, acc) {
    acc = acc || [];
    var url = YT_API_BASE + "playlistItems?part=contentDetails&maxResults=50&playlistId=" +
      encodeURIComponent(playlistId) + "&key=" + YOUTUBE_API_KEY;
    if (pageToken) url += "&pageToken=" + pageToken;
    return fetch(url).then(function(r) {
      if (!r.ok) throw new Error("playlistItems " + r.status);
      return r.json();
    }).then(function(data) {
      var ids = (data.items || []).map(function(it) { return it.contentDetails.videoId; });
      acc = acc.concat(ids);
      if (data.nextPageToken) return ytFetchAllPlaylistItems(playlistId, data.nextPageToken, acc);
      return acc;
    });
  }

  function ytFetchVideoStats(videoIds) {
    var chunks = [];
    for (var i = 0; i < videoIds.length; i += 50) chunks.push(videoIds.slice(i, i + 50));
    if (!chunks.length) {
      return Promise.resolve({ videoCount: 0, totalViews: 0, totalLikes: 0, totalComments: 0, lastPublished: null });
    }
    return Promise.all(chunks.map(function(chunk) {
      var url = YT_API_BASE + "videos?part=statistics,snippet&id=" + chunk.join(",") + "&key=" + YOUTUBE_API_KEY;
      return fetch(url).then(function(r) {
        if (!r.ok) throw new Error("videos " + r.status);
        return r.json();
      });
    })).then(function(results) {
      // likeCount/commentCount are simply absent from a video's `statistics`
      // when the creator hid likes or disabled comments on that video (not
      // an error) — treated as 0 for that video, so the total is a floor,
      // not necessarily the true total if any video does either of those.
      var totalViews = 0, totalLikes = 0, totalComments = 0, lastPublished = null, count = 0;
      results.forEach(function(res) {
        (res.items || []).forEach(function(v) {
          count++;
          var s = v.statistics || {};
          totalViews += parseInt(s.viewCount || "0", 10);
          totalLikes += parseInt(s.likeCount || "0", 10);
          totalComments += parseInt(s.commentCount || "0", 10);
          var pub = v.snippet && v.snippet.publishedAt;
          if (pub && (!lastPublished || pub > lastPublished)) lastPublished = pub;
        });
      });
      return { videoCount: count, totalViews: totalViews, totalLikes: totalLikes, totalComments: totalComments, lastPublished: lastPublished };
    });
  }

  function ytFetchChannelStats(handle) {
    var url = YT_API_BASE + "channels?part=statistics,contentDetails&forHandle=" + encodeURIComponent(handle) +
      "&key=" + YOUTUBE_API_KEY;
    return fetch(url).then(function(r) {
      if (!r.ok) throw new Error("channels " + r.status);
      return r.json();
    }).then(function(data) {
      if (!data.items || !data.items.length) throw new Error("channel not found for handle " + handle);
      var channel = data.items[0];
      var chStats = channel.statistics || {};
      // A channel can hide its subscriber count publicly — the API then
      // omits subscriberCount entirely rather than returning 0, so treat
      // "hidden" as its own state, not a zero.
      var subscriberCount = chStats.hiddenSubscriberCount ? null : parseInt(chStats.subscriberCount || "0", 10);
      var uploadsPlaylist = channel.contentDetails.relatedPlaylists.uploads;
      return ytFetchAllPlaylistItems(uploadsPlaylist).then(ytFetchVideoStats).then(function(videoRes) {
        videoRes.subscriberCount = subscriberCount;
        return videoRes;
      });
    });
  }

  function refreshLiveYouTubeStats() {
    if (YOUTUBE_API_KEY === "PASTE_YOUR_YOUTUBE_API_KEY_HERE") {
      AGENTS.forEach(function(agent) {
        if (!agent.youtube) return;
        for (var i = 0; i < 5; i++) agent.stats[i].value = "—";
        agent.statsNote = "Live YouTube stats not wired up yet — paste a YouTube Data API key into the YOUTUBE_API_KEY constant near the top of the <script> block.";
      });
      return;
    }
    AGENTS.forEach(function(agent) {
      if (!agent.youtube || !agent.youtube.handle) return;
      ytFetchChannelStats(agent.youtube.handle).then(function(res) {
        agent.stats[0].value = res.subscriberCount === null ? "Hidden by channel" : res.subscriberCount.toLocaleString("en-US");
        agent.stats[1].value = String(res.videoCount);
        agent.stats[2].value = res.totalViews.toLocaleString("en-US");
        agent.stats[3].value = res.totalLikes.toLocaleString("en-US");
        agent.stats[4].value = res.totalComments.toLocaleString("en-US");
        agent.stats[5].value = res.lastPublished ? ytFormatDate(res.lastPublished) : "—";
        agent.statsNote = "Live from YouTube (" + agent.youtube.handle + ") — subscribers, videos posted, total views/likes/comments and last-published date refresh every time this page loads, independent of whether this agent's machine is on. Likes/comments are summed per-video, so a video with likes hidden or comments disabled counts as 0 for that video.";
        // Online here means "we just heard back from YouTube for this
        // agent" — NOT "the production automation is currently running".
        // Busy/Error need a real signal from the pipeline itself (it
        // isn't deployed unattended yet for either agent), so don't set
        // those here — only flip away from the default "offline" once
        // live data has actually come back.
        if (agent.status !== "busy" && agent.status !== "error") {
          agent.status = "online";
        }
        renderNodes();
        if (currentPanelAgentId === agent.id) openPanel(agent);
      }).catch(function(err) {
        console.error("Live YouTube stats fetch failed for " + agent.id, err);
        for (var i = 0; i < 5; i++) agent.stats[i].value = "N/A";
        agent.statsNote = "Couldn't reach the YouTube API just now (offline, or the key/quota needs checking) — figures unavailable rather than shown stale. Reload the page to retry.";
        if (agent.status !== "busy" && agent.status !== "error") {
          agent.status = "offline";
        }
        renderNodes();
        if (currentPanelAgentId === agent.id) openPanel(agent);
      });
    });
  }

  var STATUS_HEX = { online: "#4fd1ff", busy: "#6ee7a8", offline: "#7b84a6", error: "#ff5d5d" };
  var STATUS_LABEL = { online: "Online", busy: "Busy", offline: "Offline", error: "Error" };
  var ORBIT_RADIUS = 320;

  // Small inline YouTube "play button" mark — self-contained (no external
  // image), used next to a channel name on any agent that has a `youtube`
  // field.
  var YT_ICON_SVG =
    '<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">' +
    '<rect x="1" y="4" width="22" height="16" rx="5" fill="#FF0033"/>' +
    '<path d="M10 8.3 L16.5 12 L10 15.7 Z" fill="#fff"/>' +
    '</svg>';

  // Size-parameterized versions of the same idea, used for multi-platform
  // agents that render as a small cluster of platform nodes instead of one
  // sphere (see `platforms` on an agent + buildClusterNodes below) — the
  // same markup is used tiny (12px) in the label row and larger (~22px)
  // inside each cluster node.
  function ytIconSvg(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true">' +
      '<rect x="1" y="4" width="22" height="16" rx="5" fill="#FF0033"/>' +
      '<path d="M10 8.3 L16.5 12 L10 15.7 Z" fill="#fff"/>' +
      '</svg>';
  }
  function tiktokIconSvg(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true">' +
      '<rect x="1" y="1" width="22" height="22" rx="6" fill="#000"/>' +
      '<path d="M14.5 4.5c.4 1.7 1.6 2.9 3.4 3.2v2.6c-1.2 0-2.4-.4-3.4-1.1v5.9c0 2.7-2.2 4.9-4.9 4.9S4.7 17.8 4.7 15.1c0-2.6 2-4.7 4.6-4.9v2.7c-1.1.2-2 1.1-2 2.2 0 1.3 1 2.3 2.3 2.3s2.3-1 2.3-2.3V4.5h2.6z" fill="#25F4EE"/>' +
      '<path d="M13.3 4.5c.4 1.7 1.6 2.9 3.4 3.2v2.6c-1.2 0-2.4-.4-3.4-1.1v5.9c0 2.7-2.2 4.9-4.9 4.9S3.5 17.8 3.5 15.1c0-2.6 2-4.7 4.6-4.9v2.7c-1.1.2-2 1.1-2 2.2 0 1.3 1 2.3 2.3 2.3s2.3-1 2.3-2.3V4.5h2.6z" fill="#FF0050" opacity="0.75"/>' +
      '<path d="M13.9 4.5c.4 1.7 1.6 2.9 3.4 3.2v2.6c-1.2 0-2.4-.4-3.4-1.1v5.9c0 2.7-2.2 4.9-4.9 4.9S4.1 17.8 4.1 15.1c0-2.6 2-4.7 4.6-4.9v2.7c-1.1.2-2 1.1-2 2.2 0 1.3 1 2.3 2.3 2.3s2.3-1 2.3-2.3V4.5h2.6z" fill="#fff"/>' +
      '</svg>';
  }
  function igIconSvg(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true">' +
      '<rect x="1" y="1" width="22" height="22" rx="6" fill="#C13584"/>' +
      '<circle cx="12" cy="12" r="5.2" fill="none" stroke="#fff" stroke-width="2"/>' +
      '<circle cx="17.6" cy="6.4" r="1.4" fill="#fff"/>' +
      '</svg>';
  }
  function platformIconSvg(key, size) {
    if (key === "tiktok") return tiktokIconSvg(size);
    if (key === "instagram") return igIconSvg(size);
    return ytIconSvg(size);
  }

  // ---------------------------------------------------------------------
  // Starfield (three parallax layers = the "looks 3D" trick)
  // ---------------------------------------------------------------------
  function paintStars(canvasEl, count, minR, maxR, minA, maxA, tint) {
    canvasEl.width = 2400; canvasEl.height = 2400;
    var ctx = canvasEl.getContext("2d");
    for (var i = 0; i < count; i++) {
      var x = Math.random() * 2400, y = Math.random() * 2400;
      var r = minR + Math.random() * (maxR - minR);
      var a = minA + Math.random() * (maxA - minA);
      ctx.beginPath();
      ctx.fillStyle = tint ? tint : "rgba(255,255,255," + a + ")";
      if (tint) ctx.globalAlpha = a; else ctx.globalAlpha = 1;
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function buildLayer(id, count, minR, maxR, minA, maxA) {
    var layer = document.getElementById(id);
    var c = document.createElement("canvas");
    c.style.width = "100%"; c.style.height = "100%"; c.style.position = "absolute";
    layer.appendChild(c);
    paintStars(c, count, minR, maxR, minA, maxA);
    // a few faintly colored stars for realism
    var c2 = document.createElement("canvas");
    c2.style.width = "100%"; c2.style.height = "100%"; c2.style.position = "absolute";
    layer.appendChild(c2);
    paintStars(c2, Math.round(count * 0.08), minR, maxR + 0.4, 0.4, 0.7, Math.random() > 0.5 ? "#9fb4ff" : "#ffd8a8");
  }
  buildLayer("starFar", 650, 0.5, 1.1, 0.25, 0.6);
  buildLayer("starMid", 320, 0.7, 1.5, 0.35, 0.8);
  buildLayer("starNear", 150, 1.0, 2.1, 0.5, 1.0);

  // sprinkle a handful of twinkling stars in the near layer for life
  var twinkleHost = document.getElementById("starNear");
  for (var t = 0; t < 22; t++) {
    var tw = document.createElement("div");
    tw.className = "twinkle";
    tw.style.left = (Math.random() * 2400) + "px";
    tw.style.top = (Math.random() * 2400) + "px";
    tw.style.animationDelay = (Math.random() * 3.4) + "s";
    twinkleHost.appendChild(tw);
  }

  // ---------------------------------------------------------------------
  // Hub rings (flattened ellipses = "ringed planet" depth cue)
  // ---------------------------------------------------------------------
  var ring1 = document.getElementById("ring1");
  ring1.style.width = "220px"; ring1.style.height = "220px"; ring1.style.margin = "-110px 0 0 -110px";
  var ring2 = document.getElementById("ring2");
  ring2.style.width = "300px"; ring2.style.height = "300px"; ring2.style.margin = "-150px 0 0 -150px";
  ring2.style.borderColor = "rgba(245,185,66,.16)";

  // ---------------------------------------------------------------------
  // Nodes + connecting links
  // ---------------------------------------------------------------------
  var nodesHost = document.getElementById("nodes");
  var labelsHost = document.getElementById("labels");
  var svg = document.getElementById("links");
  var NS = "http://www.w3.org/2000/svg";

  var defs;
  var nodeRecords = [];

  function buildNode(agent, index, total) {
    var angle = (index / total) * Math.PI * 2 - Math.PI / 2;
    var x = Math.cos(angle) * ORBIT_RADIUS;
    var y = Math.sin(angle) * ORBIT_RADIUS * 0.62; // flattened ellipse orbit = depth cue

    var color = STATUS_HEX[agent.status] || STATUS_HEX.offline;
    var isOffline = agent.status === "offline";

    // link line, hub (1300,1300 in svg local space) -> node
    var gradId = "grad-" + agent.id;
    var grad = document.createElementNS(NS, "linearGradient");
    grad.setAttribute("id", gradId);
    grad.setAttribute("x1", "1300"); grad.setAttribute("y1", "1300");
    grad.setAttribute("x2", 1300 + x); grad.setAttribute("y2", 1300 + y);
    grad.setAttribute("gradientUnits", "userSpaceOnUse");
    grad.innerHTML = '<stop offset="0%" stop-color="#f5b942" stop-opacity="0.55"/><stop offset="100%" stop-color="' + color + '" stop-opacity="0.55"/>';
    defs.appendChild(grad);

    var line = document.createElementNS(NS, "line");
    line.setAttribute("x1", 1300); line.setAttribute("y1", 1300);
    line.setAttribute("x2", 1300 + x); line.setAttribute("y2", 1300 + y);
    line.setAttribute("stroke", "url(#" + gradId + ")");
    line.setAttribute("stroke-width", "1.5");
    svg.appendChild(line);

    if (!isOffline) {
      var pulse = document.createElementNS(NS, "circle");
      pulse.setAttribute("r", "4");
      pulse.setAttribute("fill", color);
      pulse.innerHTML =
        '<animateMotion dur="' + (3.4 + Math.random()) + 's" repeatCount="indefinite" ' +
        'path="M 1300 1300 L ' + (1300 + x) + ' ' + (1300 + y) + '"/>' +
        '<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="' + (3.4 + Math.random()) + 's" repeatCount="indefinite"/>';
      svg.appendChild(pulse);
    }

    // node circle(s) — a plain agent gets one sphere; an agent with
    // `platforms` (2+ entries) gets a small cluster of mini nodes instead,
    // one per platform, all opening the same detail panel.
    if (agent.platforms && agent.platforms.length > 1) {
      buildClusterNodes(agent, x, y, color, isOffline);
    } else {
      var el = document.createElement("div");
      el.className = "node";
      el.style.left = "calc(50% + " + x + "px)";
      el.style.top = "calc(50% + " + y + "px)";
      el.style.background = isOffline
        ? "radial-gradient(circle at 34% 28%, #b7bdd6 0%, " + color + " 55%, #2a2f45 100%)"
        : "radial-gradient(circle at 34% 28%, #ffffff 0%, " + color + " 45%, #10141f 100%)";
      el.style.boxShadow = isOffline
        ? "0 0 18px 3px " + color + "55, inset -6px -6px 12px rgba(0,0,0,.4)"
        : "0 0 28px 8px " + color + "80, 0 0 60px 18px " + color + "30, inset -6px -6px 12px rgba(0,0,0,.4)";
      el.addEventListener("click", function() { openPanel(agent); });
      nodesHost.appendChild(el);
    }

    // label — clustered agents sit below the whole cluster (past the
    // bottom-most mini-planet), not at the orbit slot center, otherwise it
    // lands right on top of the first platform's node.
    var isCluster = agent.platforms && agent.platforms.length > 1;
    var labelY = isCluster ? y + 25 : y;
    var labelEl = document.createElement("div");
    labelEl.className = "label " + agent.status + (isCluster ? " below" : "");
    labelEl.style.left = "calc(50% + " + x + "px)";
    labelEl.style.top = "calc(50% + " + labelY + "px)";
    var channelLine = (agent.platforms && agent.platforms.length > 1)
      ? '<div class="channel-line">' + agent.platforms.map(function(p) { return platformIconSvg(p.key, 12); }).join("") + '</div>'
      : (agent.youtube && agent.youtube.channelTitle)
      ? '<div class="channel-line">' + YT_ICON_SVG + '<span>' + agent.youtube.channelTitle + '</span></div>'
      : '';
    labelEl.innerHTML =
      '<div class="name">' + agent.name + '</div>' +
      channelLine +
      '<div class="chip"><span class="dot"></span>' + STATUS_LABEL[agent.status] + '</div>';
    labelEl.addEventListener("click", function() { openPanel(agent); });
    labelsHost.appendChild(labelEl);

    nodeRecords.push({ agent: agent, x: x, y: y });
  }

  // Small triangular offsets (in px, relative to the orbit slot center) for
  // up to 3 clustered mini-nodes. A 4th+ platform would need a bigger
  // arrangement, but no agent needs that yet.
  var CLUSTER_OFFSETS = [
    { dx: 0, dy: -18 },
    { dx: -17, dy: 12 },
    { dx: 17, dy: 12 }
  ];

  // Brand color per platform — the cluster mini-nodes are shaded spheres
  // (same radial-gradient recipe as the main .node "planet") tinted by
  // platform rather than by status, so each reads as its own little planet.
  var PLATFORM_COLORS = { youtube: "#FF0033", tiktok: "#25F4EE", instagram: "#C13584" };

  // Renders one small clickable "planet" per platform, clustered tightly
  // around the orbit slot (x,y) instead of the usual single big sphere —
  // used for agents that bundle several platforms under one identity (see
  // `platforms` on an agent). All mini-nodes open the same detail panel.
  function buildClusterNodes(agent, cx, cy, statusColor, isOffline) {
    agent.platforms.forEach(function(p, i) {
      var off = CLUSTER_OFFSETS[i % CLUSTER_OFFSETS.length];
      var px = cx + off.dx, py = cy + off.dy;
      var pColor = PLATFORM_COLORS[p.key] || statusColor;
      var el = document.createElement("div");
      el.className = "node cluster-node";
      el.style.left = "calc(50% + " + px + "px)";
      el.style.top = "calc(50% + " + py + "px)";
      el.style.width = "26px";
      el.style.height = "26px";
      el.style.margin = "-13px 0 0 -13px";
      el.style.background = isOffline
        ? "radial-gradient(circle at 34% 28%, #b7bdd6 0%, " + pColor + " 55%, #2a2f45 100%)"
        : "radial-gradient(circle at 34% 28%, #ffffff 0%, " + pColor + " 45%, #10141f 100%)";
      el.style.boxShadow = isOffline
        ? "0 0 10px 2px " + pColor + "55, inset -4px -4px 8px rgba(0,0,0,.4)"
        : "0 0 16px 5px " + pColor + "80, 0 0 32px 10px " + pColor + "30, inset -4px -4px 8px rgba(0,0,0,.4)";
      el.title = p.label;
      el.addEventListener("click", function() { openPanel(agent); });
      nodesHost.appendChild(el);
    });
  }

  // (Re)builds every node/label/link from the current AGENTS array. Called
  // once at load, and again whenever a live fetch changes an agent's
  // status (e.g. offline -> online once we've actually heard back from
  // YouTube) so the sphere color/glow and status chip stay in sync
  // without a full page reload.
  function renderNodes() {
    nodesHost.innerHTML = "";
    labelsHost.innerHTML = "";
    svg.innerHTML = "";
    defs = document.createElementNS(NS, "defs");
    svg.appendChild(defs);
    nodeRecords = [];

    AGENTS.forEach(function(agent, i) { buildNode(agent, i, AGENTS.length); });

    document.getElementById("totalCount").textContent = AGENTS.length;
    document.getElementById("onlineCount").textContent =
      AGENTS.filter(function(a) { return a.status === "online" || a.status === "busy"; }).length;
  }

  renderNodes();
  refreshLiveYouTubeStats();

  var refreshBtn = document.getElementById("refreshBtn");
  refreshBtn.addEventListener("click", function() {
    refreshBtn.classList.remove("spinning");
    void refreshBtn.offsetWidth; // restart the animation on repeat clicks
    refreshBtn.classList.add("spinning");
    refreshLiveYouTubeStats();
  });

  var panel = document.getElementById("panel");
  var currentPanelAgentId = null;
  document.getElementById("panelClose").addEventListener("click", function() { panel.classList.remove("open"); currentPanelAgentId = null; });
  function openPanel(agent) {
    currentPanelAgentId = agent.id;
    document.getElementById("panelEyebrow").textContent = agent.role;
    document.getElementById("panelName").textContent = agent.name;
    var color = STATUS_HEX[agent.status] || STATUS_HEX.offline;
    document.getElementById("panelStatus").innerHTML =
      '<span class="dot" style="background:' + color + ';color:' + color + '"></span><span style="color:' + color + '">' + STATUS_LABEL[agent.status] + '</span>';
    document.getElementById("panelDetail").textContent = agent.detail;
    document.getElementById("panelLastActive").textContent = agent.lastActive || "—";

    function statTile(s) {
      return '<div class="stat-tile"><div class="stat-label">' + s.label + '</div><div class="stat-value">' + s.value + '</div></div>';
    }

    // The 4 stats people check at a glance (Subscribers, Videos posted,
    // Total views, Total likes — always stats[0..3], see how the live
    // YouTube fetch writes into this array) stay visible without a click;
    // everything else moves into the "More data" toggle.
    var primaryEl = document.getElementById("panelPrimaryStats");
    var PRIMARY_COUNT = 4;
    var primaryStats = (agent.stats || []).slice(0, PRIMARY_COUNT);
    var restStats = (agent.stats || []).slice(PRIMARY_COUNT);
    primaryEl.innerHTML = primaryStats.map(statTile).join("");
    primaryEl.style.display = primaryStats.length ? "" : "none";

    var statsToggle = document.getElementById("panelStatsToggle");
    if (restStats.length) {
      var grid = document.getElementById("panelStatsGrid");
      grid.innerHTML = restStats.map(statTile).join("");
      document.getElementById("panelStatsNote").textContent = agent.statsNote || "";
      statsToggle.style.display = "";
      statsToggle.open = false;
    } else {
      statsToggle.style.display = "none";
    }

    panel.classList.add("open");
  }

  function tickClock() {
    var now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleDateString(undefined, { weekday: "short", day: "2-digit", month: "short" }) + " · " +
      now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }
  tickClock();
  setInterval(tickClock, 15000);

  // ---------------------------------------------------------------------
  // Pan (swipe any direction) + zoom. Pure 2D translate/scale — no rotation.
  // ---------------------------------------------------------------------
  var viewportEl = document.getElementById("viewport");
  var worldEl = document.getElementById("world");
  var farEl = document.getElementById("starFar");
  var midEl = document.getElementById("starMid");
  var nearEl = document.getElementById("starNear");
  var ringsEl = [ring1, ring2];

  var PAN_BOUND = 420;
  // Fit the whole orbit (hub + all nodes) inside the viewport on first
  // load, instead of always starting at zoom 1 — with 3+ agents (and a
  // clustered agent needing a bit of extra room) that no longer reliably
  // fit on a phone screen without the user having to pinch-zoom out first.
  function computeInitialZoom() {
    var halfW = ORBIT_RADIUS + 40;
    var halfH = ORBIT_RADIUS * 0.62 + 40;
    var fit = Math.min(window.innerWidth / (halfW * 2), window.innerHeight / (halfH * 2));
    return Math.max(0.55, Math.min(1, fit * 0.92));
  }
  var panX = 0, panY = 0, zoom = computeInitialZoom();
  var dragging = false, lastX = 0, lastY = 0;
  var activePointers = {};
  var lastPinchDist = 0;
  var driftPhase = Math.random() * 10;

  function applyTransform() {
    var px = Math.max(-PAN_BOUND, Math.min(PAN_BOUND, panX));
    var py = Math.max(-PAN_BOUND, Math.min(PAN_BOUND, panY));
    var z = Math.max(0.55, Math.min(1.9, zoom));
    worldEl.style.transform = "translate(" + px + "px," + py + "px) scale(" + z + ")";
    farEl.style.transform = "translate(calc(-50% + " + (px * 0.10) + "px), calc(-50% + " + (py * 0.10) + "px))";
    midEl.style.transform = "translate(calc(-50% + " + (px * 0.28) + "px), calc(-50% + " + (py * 0.28) + "px))";
    nearEl.style.transform = "translate(calc(-50% + " + (px * 0.5) + "px), calc(-50% + " + (py * 0.5) + "px))";
  }
  farEl.style.transform = "translate(-50%,-50%)";
  midEl.style.transform = "translate(-50%,-50%)";
  nearEl.style.transform = "translate(-50%,-50%)";
  applyTransform();

  viewportEl.addEventListener("pointerdown", function(e) {
    dragging = true; viewportEl.classList.add("dragging");
    lastX = e.clientX; lastY = e.clientY;
    activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener("pointerup", function(e) {
    dragging = false; viewportEl.classList.remove("dragging");
    delete activePointers[e.pointerId];
    lastPinchDist = 0;
  });
  window.addEventListener("pointercancel", function(e) {
    dragging = false; viewportEl.classList.remove("dragging");
    delete activePointers[e.pointerId];
    lastPinchDist = 0;
  });
  window.addEventListener("pointermove", function(e) {
    if (activePointers[e.pointerId]) activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(activePointers);
    if (ids.length === 2) {
      var p1 = activePointers[ids[0]], p2 = activePointers[ids[1]];
      var dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      if (lastPinchDist) zoom *= (dist / lastPinchDist);
      lastPinchDist = dist;
      applyTransform();
      return;
    }
    if (!dragging) return;
    panX += (e.clientX - lastX);
    panY += (e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
  });
  viewportEl.addEventListener("wheel", function(e) {
    zoom -= e.deltaY * 0.001;
    applyTransform();
    e.preventDefault();
  }, { passive: false });

  // gentle ambient drift when idle, so the scene feels alive without input
  var idleTimer = 0;
  setInterval(function() {
    if (dragging) return;
    idleTimer += 0.02;
    var driftX = Math.sin(idleTimer * 0.5 + driftPhase) * 14;
    var driftY = Math.cos(idleTimer * 0.37 + driftPhase) * 8;
    ringsEl[0].style.transform = "translate(" + driftX * 0.3 + "px," + driftY * 0.3 + "px) scaleY(0.34) rotate(" + (idleTimer * 6) + "deg)";
    ringsEl[1].style.transform = "translate(" + driftX * 0.2 + "px," + driftY * 0.2 + "px) scaleY(0.3) rotate(" + (-idleTimer * 4) + "deg)";
  }, 30);

  window.addEventListener("resize", applyTransform);
})();
</script>
